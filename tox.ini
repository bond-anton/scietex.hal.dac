[tox]
envlist = py{310,312,314}

[testenv]
description = install the test suite with both SPI backends and run it
extras = test,spi,gpiozero
commands = pytest {posargs} tests

[testenv:format]
description = check formatting with ruff
deps = ruff==0.17.4
skip_install = true
commands = ruff format --check {posargs:.}

[testenv:lint]
description = lint with ruff
deps = ruff==0.17.4
skip_install = true
commands = ruff check {posargs:.}

[testenv:type]
description = run type checks on src
deps = ty==0.0.99
commands = ty check {posargs:src}

[testenv:core]
description = core install without the optional SPI backends
# Clear the inherited extras so the env keeps only the base dependencies.
extras =
deps = pytest
commands =
    python -c "import importlib.util, sys, scietex.hal.dac; loaded = [n for n in ('spidev', 'gpiozero') if n in sys.modules]; present = [n for n in ('spidev', 'gpiozero') if importlib.util.find_spec(n) is not None]; sys.exit(f'core env violates isolation: loaded={loaded} present={present}' if (loaded or present) else 0)"
    pytest {posargs:tests} -q
